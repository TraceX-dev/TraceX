name: ZAP baseline scan
description: Run a ZAP baseline scan and publish severity counts.

inputs:
  target:
    description: URL to scan.
    required: true
  environment-name:
    description: Environment label used in the report summary.
    required: true
  artifact-name:
    description: Name of the generated report artifact.
    required: true

outputs:
  critical:
    description: Number of critical findings.
    value: ${{ steps.summary.outputs.critical }}
  high:
    description: Number of high findings.
    value: ${{ steps.summary.outputs.high }}
  medium:
    description: Number of medium findings.
    value: ${{ steps.summary.outputs.medium }}
  low:
    description: Number of low findings.
    value: ${{ steps.summary.outputs.low }}

runs:
  using: composite
  steps:
    # zaproxy/action-baseline@v0.15.0
    - uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874
      with:
        target: ${{ inputs.target }}
        cmd_options: '-m 2'
        allow_issue_writing: false
        fail_action: false
        artifact_name: ${{ inputs.artifact-name }}
    - id: summary
      name: Generate ZAP (DAST) summary
      if: always()
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path

        report_path = Path("report_json.json")
        environment_name = os.environ["ENVIRONMENT_NAME"]
        artifact_name = os.environ["ARTIFACT_NAME"]
        markdown = f"## ZAP {environment_name} baseline\n\n"
        counts = {severity: "unknown" for severity in ("critical", "high", "medium", "low")}

        if not report_path.exists():
            markdown += f"The full ZAP report is attached as the `{artifact_name}` artifact.\n"
        else:
            report = json.loads(report_path.read_text())
            alerts = [alert for site in report.get("site", []) for alert in site.get("alerts", [])]
            risk_names = {"0": "Informational", "1": "Low", "2": "Medium", "3": "High"}
            counts = {risk: 0 for risk in risk_names}

            for alert in alerts:
                risk = str(alert.get("riskcode", "0"))
                counts[risk] = counts.get(risk, 0) + 1

            markdown += "| Risk | Alerts |\n| --- | ---: |\n"
            markdown += "\n".join(f"| {risk_names[risk]} | {counts[risk]} |" for risk in reversed(risk_names))
            markdown += "\n"
            counts = {
                "critical": 0,
                "high": counts["3"],
                "medium": counts["2"],
                "low": counts["1"],
            }

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write(markdown)
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write("".join(f"{severity}={counts[severity]}\n" for severity in counts))
        PYTHON
