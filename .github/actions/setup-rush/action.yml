name: Set up Rush
description: Install pinned dependencies and restore separate pnpm and Rush caches.
inputs:
  cache-scope:
    description: Producer name used when saving Rush build-cache entries.
    required: true
  restore-build-cache:
    description: Restore and save the Rush build cache.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      id: node
      with:
        node-version-file: .nvmrc
    - name: Resolve cache revision
      id: revision
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm downloads
      uses: actions/cache@v6
      with:
        path: common/temp/pnpm-store
        key: pnpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('rush.json', 'common/config/rush/pnpm-lock.yaml', 'common/config/rush/pnpm-config.json', 'common/config/rush/.pnpmfile.cjs') }}
        restore-keys: |
          pnpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-
    - name: Cache Rush outputs
      if: inputs.restore-build-cache == 'true'
      uses: actions/cache@v6
      with:
        path: common/temp/build-cache
        key: rush-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-${{ steps.revision.outputs.sha }}-${{ inputs.cache-scope }}
        restore-keys: |
          rush-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-${{ steps.revision.outputs.sha }}-
          rush-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}-
          rush-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-
    - name: Install dependencies from lockfile
      shell: bash
      run: node common/scripts/install-run-rush.js install
