name: CI
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
on:
  push:
    branches:
      - develop
    tags:
      - v*
      - s*
  pull_request:
    branches:
      - develop
      - staging
      - staging-new
      - main
  workflow_dispatch:
    inputs:
      skip_publish:
        description: Skip all publishing (npm, Docker, R2) when testing release flow
        required: false
        default: false
        type: boolean
env:
  PublishTempFolder: publish_artifacts
  INIT_SCRIPTS_BRANCH: main
jobs:
  prepare:
    name: Release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_ref: ${{ steps.revision.outputs.target_ref }}
      version: ${{ steps.revision.outputs.version }}
      release: ${{ steps.revision.outputs.release }}
      production: ${{ steps.revision.outputs.production }}
      publish: ${{ steps.revision.outputs.publish }}
    steps:
      - name: Classify event ref and publication policy
        id: revision
        env:
          TARGET_REF: ${{ github.ref }}
          SKIP_PUBLISH: ${{ inputs.skip_publish || false }}
        run: |
          set -euo pipefail
          release=false
          production=false
          publish=false
          version=
          if [[ "$TARGET_REF" =~ ^refs/tags/([vs])[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release=true
            version="${TARGET_REF#refs/tags/}"
            if [[ "$version" == v* ]]; then production=true; fi
            if [[ "$SKIP_PUBLISH" != true ]]; then publish=true; fi
          fi
          {
            echo "target_ref=$TARGET_REF"
            echo "version=$version"
            echo "release=$release"
            echo "production=$production"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: build
          restore-build-cache: "true"
      - name: Check dependency ranges
        run: node common/scripts/install-run-rush.js check
      - name: Check transitive dependencies
        run: node common/scripts/check-versions.js
      - name: Test CI infrastructure helpers
        run: node --test common/scripts/ci.test.js
      - name: Compile packages
        run: node common/scripts/install-run-rush.js build
      - name: Validate packages
        run: node common/scripts/install-run-rush.js validate
      - name: Bundle test administration tool
        working-directory: dev/tool
        run: node ../../common/scripts/install-run-rushx.js bundle
      - name: Archive generated package outputs
        run: node common/scripts/ci-build-artifacts.js pack "$RUNNER_TEMP/package-outputs.tgz"
      - name: Upload generated package outputs
        uses: actions/upload-artifact@v6
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs.tgz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Create SBOM directory
        run: mkdir -p sbom
      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom/repository.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload repository SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom-repository
          path: sbom/repository.spdx.json
          overwrite: true
  formatting:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: formatting
          restore-build-cache: "false"
      - name: Check formatting in changed projects
        env:
          BASE_BRANCH: ${{ github.base_ref || 'develop' }}
        run: node common/scripts/install-run-rush.js fast-format --branch "$BASE_BRANCH"
      - name: Reject formatting changes
        run: git diff --exit-code -- '*.js' '*.mjs' '*.ts' '*.svelte' '*.json' '*.yaml' '*.yml'
  svelte-check:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: svelte-check
          restore-build-cache: "true"
      - name: Download package outputs
        uses: actions/download-artifact@v8
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs
      - name: Restore package outputs for this commit
        run: node common/scripts/ci-build-artifacts.js restore "$RUNNER_TEMP/package-outputs/package-outputs.tgz"
      - name: Check Svelte sources
        run: node common/scripts/install-run-rush.js svelte-check -v
  test:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: test
          restore-build-cache: "true"
      - name: Download package outputs
        uses: actions/download-artifact@v8
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs
      - name: Restore package outputs for this commit
        run: node common/scripts/ci-build-artifacts.js restore "$RUNNER_TEMP/package-outputs/package-outputs.tgz"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        if: env.DOCKER_USERNAME != ''
        continue-on-error: true
      - name: Prepare server
        run: |
          cd ./tests
          ./prepare-tests.sh
      - name: Testing...
        run: node common/scripts/install-run-rush.js test --verbose
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5433/postgres
          ELASTIC_URL: http://localhost:9201
  test-images:
    name: Build test images once
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: test-images
          restore-build-cache: "true"
      - name: Download package outputs
        uses: actions/download-artifact@v8
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs
      - name: Restore package outputs for this commit
        run: node common/scripts/ci-build-artifacts.js restore "$RUNNER_TEMP/package-outputs/package-outputs.tgz"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        if: env.DOCKER_USERNAME != ''
        continue-on-error: true
      - name: Build native test images
        run: node common/scripts/install-run-rush.js docker
        env:
          DOCKER_VERSION: ${{ github.sha }}
          DOCKER_EXTRA: --platform=linux/amd64
          DOCKER_CLI_HINTS: "false"
          DOCKER_BUILDKIT: "1"
          DOCKER_BUILD_CLEANUP: "true"
      - name: Export test images and Compose aliases
        run: node common/scripts/ci-docker-images.js save "$RUNNER_TEMP/test-images.tar" "$CI_COMMIT_SHA"
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
      - name: Upload shared test images
        uses: actions/upload-artifact@v6
        with:
          name: test-images
          path: ${{ runner.temp }}/test-images.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
          overwrite: true
  uitest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: uitest
          restore-build-cache: "true"
      - name: Download package outputs
        uses: actions/download-artifact@v8
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs
      - name: Restore package outputs for this commit
        run: node common/scripts/ci-build-artifacts.js restore "$RUNNER_TEMP/package-outputs/package-outputs.tgz"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        if: env.DOCKER_USERNAME != ''
        continue-on-error: true
      - name: Download shared test images
        uses: actions/download-artifact@v8
        with:
          name: test-images
          path: ${{ runner.temp }}/test-images
      - name: Load shared test images
        run: |-
          docker image load --input "$RUNNER_TEMP/test-images/test-images.tar"
          rm "$RUNNER_TEMP/test-images/test-images.tar"
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 tracex.local" | sudo tee -a /etc/hosts
      - name: Prepare server
        run: |
          cd ./tests
          export DO_CLEAN="true"
          ./prepare.sh
      - name: Install Playwright
        run: |
          cd ./tests/sanity
          node ../../common/scripts/install-run-rushx.js ci
      - name: Start profiling
        run: |
          cd ./tests
          ./profile-start.sh
      - name: Run UI tests
        run: |
          cd ./tests/sanity
          node ../../common/scripts/install-run-rushx.js uitest
      - name: Download profile
        run: |
          cd ./tests
          ./profile-download.sh
          npm install -g cpupro
          ./profile-generate.sh
      - name: Upload profiling results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: profiling
          path: ./tests/profiles
          overwrite: true
      - name: Store docker logs
        if: always()
        run: |
          cd ./tests/sanity
          mkdir logs
          cd logs
          docker ps -a --format '{{.Names}}' | xargs -I {} sh -c 'docker logs {} > {}_logs.log 2>&1'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: ./tests/sanity/playwright-report/
          overwrite: true
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-logs
          path: ./tests/sanity/logs
          overwrite: true
    needs:
      - prepare
      - test-images
  uitest-qms:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: qms-gh-pages-${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/s')) && 'publish' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: uitest-qms
          restore-build-cache: "true"
      - name: Download package outputs
        uses: actions/download-artifact@v8
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs
      - name: Restore package outputs for this commit
        run: node common/scripts/ci-build-artifacts.js restore "$RUNNER_TEMP/package-outputs/package-outputs.tgz"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        if: env.DOCKER_USERNAME != ''
        continue-on-error: true
      - name: Download shared test images
        uses: actions/download-artifact@v8
        with:
          name: test-images
          path: ${{ runner.temp }}/test-images
      - name: Load shared test images
        run: |-
          docker image load --input "$RUNNER_TEMP/test-images/test-images.tar"
          rm "$RUNNER_TEMP/test-images/test-images.tar"
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 tracex.local" | sudo tee -a /etc/hosts
      - name: Prepare server
        run: |
          cd ./qms-tests
          export DO_CLEAN=true
          ./prepare.sh
      - name: Install Playwright
        run: |
          cd ./qms-tests/sanity
          node ../../common/scripts/install-run-rushx.js ci
      - name: Run UI tests
        run: |
          cd ./qms-tests/sanity
          node ../../common/scripts/install-run-rushx.js uitest
      - name: Store docker logs
        if: always()
        run: |
          cd ./qms-tests/sanity
          mkdir logs
          cd logs
          docker ps -a --format '{{.Names}}' | xargs -I {} sh -c 'docker logs {} > {}_logs.log 2>&1'
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-qms
          path: ./qms-tests/sanity/playwright-report/
          overwrite: true
      - name: Publish QMS report to gh-pages
        if: ${{ always() && !cancelled() && github.event_name == 'push' && needs.prepare.outputs.publish == 'true' && hashFiles('qms-tests/sanity/playwright-report/index.html') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./qms-tests/sanity/playwright-report
          destination_dir: qms/${{ startsWith(needs.prepare.outputs.target_ref, 'refs/tags/v') && 'v' || 's' }}/${{ needs.prepare.outputs.version }}
          keep_files: true
      - name: Update latest QMS report pointer
        if: ${{ always() && !cancelled() && github.event_name == 'push' && needs.prepare.outputs.publish == 'true' && hashFiles('qms-tests/sanity/playwright-report/index.html') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./qms-tests/sanity/playwright-report
          destination_dir: qms/${{ startsWith(needs.prepare.outputs.target_ref, 'refs/tags/v') && 'v' || 's' }}/latest
          keep_files: true
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-logs-qms
          path: ./qms-tests/sanity/logs
          overwrite: true
    needs:
      - prepare
      - test-images
  uitest-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: uitest-workspaces
          restore-build-cache: "true"
      - name: Download package outputs
        uses: actions/download-artifact@v8
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs
      - name: Restore package outputs for this commit
        run: node common/scripts/ci-build-artifacts.js restore "$RUNNER_TEMP/package-outputs/package-outputs.tgz"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        if: env.DOCKER_USERNAME != ''
        continue-on-error: true
      - name: Download shared test images
        uses: actions/download-artifact@v8
        with:
          name: test-images
          path: ${{ runner.temp }}/test-images
      - name: Load shared test images
        run: |-
          docker image load --input "$RUNNER_TEMP/test-images/test-images.tar"
          rm "$RUNNER_TEMP/test-images/test-images.tar"
      - name: Configure /etc/hosts
        run: |
          sudo echo "127.0.0.1 tracex.local" | sudo tee -a /etc/hosts
      - name: Prepare server
        run: |
          cd ./ws-tests
          export DO_CLEAN=true
          ./prepare.sh
      - name: Run API tests
        run: |
          cd ./ws-tests/api-tests
          node ../../common/scripts/install-run-rush.js validate --to @hcengineering/api-tests
          node ../../common/scripts/install-run-rushx.js api-test --verbose
      - name: Install Playwright
        run: |
          cd ./ws-tests/sanity
          node ../../common/scripts/install-run-rushx.js ci
      - name: Run UI tests
        run: |
          cd ./ws-tests/sanity
          node ../../common/scripts/install-run-rushx.js uitest
      - name: Store docker logs
        if: always()
        run: |
          cd ./ws-tests/sanity
          mkdir logs
          cd logs
          docker ps -a --format '{{.Names}}' | xargs -I {} sh -c 'docker logs {} > {}_logs.log 2>&1'
      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-api
          path: ./ws-tests/api-tests/playwright-report/
          overwrite: true
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-ws
          path: ./ws-tests/sanity/playwright-report/
          overwrite: true
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-logs-ws
          path: ./ws-tests/sanity/logs
          overwrite: true
    needs:
      - prepare
      - test-images
  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - prepare
      - build
      - formatting
      - svelte-check
      - test
      - test-images
      - uitest
      - uitest-qms
      - uitest-workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const checks = JSON.parse(process.env.CHECK_RESULTS)
          const failed = Object.entries(checks).filter(([, check]) => check.result !== 'success')
          for (const [name, check] of failed) console.error(name + ': ' + check.result)
          if (failed.length > 0) process.exit(1)
          NODE
  docker-build:
    needs:
      - prepare
      - quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Configure docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Checkout init repository
        run: |
          wget https://github.com/hcengineering/init/archive/refs/heads/${{env.INIT_SCRIPTS_BRANCH}}.zip
          unzip ${{env.INIT_SCRIPTS_BRANCH}}.zip -d pods/workspace
          mv pods/workspace/init-${{env.INIT_SCRIPTS_BRANCH}} pods/workspace/init
          rm -rf ${{env.INIT_SCRIPTS_BRANCH}}.zip
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: release-docker
          restore-build-cache: "true"
      - name: Download package outputs
        uses: actions/download-artifact@v8
        with:
          name: package-outputs
          path: ${{ runner.temp }}/package-outputs
      - name: Restore package outputs for this commit
        run: node common/scripts/ci-build-artifacts.js restore "$RUNNER_TEMP/package-outputs/package-outputs.tgz"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        if: env.DOCKER_USERNAME != ''
        continue-on-error: true
      - name: Download Syft
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Add Syft to PATH
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"
      - name: Docker build
        run: |
          node common/scripts/install-run-rush.js docker:build -v
        env:
          DOCKER_CLI_HINTS: false
          DOCKER_EXTRA: --platform=linux/amd64,linux/arm64
          DOCKER_BUILDKIT: 1
          DOCKER_BUILD_CLEANUP: true
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        if: ${{ needs.prepare.outputs.publish == 'true' }}
      - name: Publish release images
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        env:
          DOCKER_VERSION: ${{ needs.prepare.outputs.version }}
        run: node common/scripts/install-run-rush.js docker:push -v
      - name: Generate Docker image SBOMs
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        continue-on-error: true
        run: |
          node common/scripts/install-run-rush.js docker:sbom -v
        env:
          SBOM_OUTPUT_DIR: ${{ github.workspace }}/sbom/docker
          DOCKER_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Upload Docker image SBOMs
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: sbom-docker-images
          path: sbom/docker/*.spdx.json
          overwrite: true
    if: ${{ needs.prepare.outputs.release == 'true' }}
  qms-dist-build:
    if: ${{ needs.prepare.outputs.release == 'true' }}
    needs:
      - prepare
      - quality-gate
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: desktop-release
          restore-build-cache: "true"
      - name: Model version from git tags
        run: node common/scripts/install-run-rush.js model-version
      - name: Package
        run: node common/scripts/install-run-rush.js package --to qms-desktop -v
      - name: Set desktop distribution version from the requested tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const filename = 'qms-desktop-package/package.json'
          const packageJson = JSON.parse(fs.readFileSync(filename, 'utf8'))
          packageJson.version = process.env.RELEASE_VERSION.slice(1)
          fs.writeFileSync(filename, JSON.stringify(packageJson, null, 2) + '\n')
          NODE
      - name: Install the Apple certificate and provisioning profile
        env:
          DEV_ID_P12_BASE64: ${{ secrets.DEV_ID_P12_BASE64 }}
          DEV_ID_P12_PASSWORD: ${{ secrets.DEV_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate from secret
          echo -n "$DEV_ID_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEV_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Build distribution's
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_APP_PASS: ${{ secrets.APPLE_ID_APP_PASS }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd qms-desktop-package
          if [[ "${RELEASE_VERSION}" == s* ]]; then
            variant=staging
            dist_command=dist-staging
            signed_command=dist-staging-signed
          else
            variant=prod
            dist_command=dist
            signed_command=dist-signed
          fi
          node ../common/scripts/install-run-rushx.js "$dist_command" --linux --x64
          node ../common/scripts/install-run-rushx.js "$dist_command" --windows --x64 --arm64
          node ../common/scripts/install-run-rushx.js "$signed_command" --macos --x64 --arm64
          ./scripts/copy-publish-artifacts.sh ${{ env.PublishTempFolder}} "$variant"
      - name: Publish distribution assets and version
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.S3_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: "5"
        run: |
          # Classic transfer client instead of CRT (CRT fails with FIRST_BYTE_TIMEOUT on big uploads)
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.cli_read_timeout 0
          aws configure set default.cli_connect_timeout 60
          aws configure set default.s3.max_concurrent_requests 4
          aws configure set default.s3.multipart_threshold 128MB
          aws configure set default.s3.multipart_chunksize 64MB
          # sync is idempotent: already uploaded files are skipped on retry
          for i in 1 2 3; do
            if aws s3 sync "qms-desktop-package/${{ env.PublishTempFolder }}" "s3://${{ secrets.DIST_S3_BUCKET }}/" \
              --endpoint-url "${{ secrets.S3_ENDPOINT }}"; then
              exit 0
            fi
            echo "::warning::S3 sync failed (attempt $i/3), retrying in 30s"
            sleep 30
          done
          echo "::error::S3 sync failed after 3 attempts"
          exit 1
      - name: Upload MacOS
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(needs.prepare.outputs.target_ref, 'refs/tags/s') && 'TraceX-Staging-MacOS-x64' || 'TraceX-MacOS-x64' }}
          path: ./qms-desktop-package/deploy/TraceX*-macos-*-x64.dmg
          overwrite: true
      - name: Upload MacOS arm64
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(needs.prepare.outputs.target_ref, 'refs/tags/s') && 'TraceX-Staging-MacOS-arm64' || 'TraceX-MacOS-arm64' }}
          path: ./qms-desktop-package/deploy/TraceX*-macos-*-arm64.dmg
          overwrite: true
      - name: Upload Windows
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(needs.prepare.outputs.target_ref, 'refs/tags/s') && 'TraceX-Staging-Windows' || 'TraceX-Windows' }}
          path: ./qms-desktop-package/deploy/TraceX*-windows-*.zip
          overwrite: true
      - name: Upload Linux
        uses: actions/upload-artifact@v6
        with:
          name: ${{ startsWith(needs.prepare.outputs.target_ref, 'refs/tags/s') && 'TraceX-Staging-Linux' || 'TraceX-Linux' }}
          path: ./qms-desktop-package/deploy/TraceX*-linux-*.zip
          overwrite: true
  publish-npm:
    if: ${{ needs.prepare.outputs.production == 'true' && needs.prepare.outputs.publish == 'true' }}
    needs:
      - prepare
      - quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: tree:0
          submodules: recursive
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: publish-npm
          restore-build-cache: "true"
      - name: Prepare npm package versions
        run: |
          set -euo pipefail
          REF="$RELEASE_REF"
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm packages can only be published from a vMAJOR.MINOR.PATCH production tag."
            exit 1
          fi
          VERSION="${REF#refs/tags/v}"
          node common/scripts/bump.js "$VERSION"
          node common/scripts/bump.js --check "$VERSION"
        env:
          RELEASE_REF: ${{ needs.prepare.outputs.target_ref }}
      - name: Building...
        run: node common/scripts/install-run-rush.js build
      - name: Emit TypeScript declarations
        run: node common/scripts/install-run-rush.js validate
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/common/config/rush/.npmrc-publish
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          node common/scripts/safe-publish.js
