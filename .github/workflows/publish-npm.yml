name: Publish npm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Production tag ref to publish (e.g. refs/tags/v0.7.427)'
        required: true

jobs:
  publish-npm:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-platform
        with:
          path: common/temp
          key: ${{ runner.os }}-build-cache-node-platform-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-build-cache-node-platform-
      - name: Installing...
        run: node common/scripts/install-run-rush.js install
      - name: Prepare npm package versions
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref }}"
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm packages can only be published from a vMAJOR.MINOR.PATCH production tag."
            exit 1
          fi
          VERSION="${REF#refs/tags/v}"
          node common/scripts/bump.js "$VERSION"
          node common/scripts/bump.js --check "$VERSION"
      - name: Building...
        run: node common/scripts/install-run-rush.js build
      - name: Emit TypeScript declarations
        run: node common/scripts/install-run-rush.js validate
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          node common/scripts/safe-publish.js
