name: Publish npm
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Production tag ref to publish (e.g. refs/tags/v0.7.427)
        required: true
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
      - name: Require successful CI checks for this commit
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const revision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'main.yml', head_sha: revision, event: 'push', per_page: 100
            })
            for (const run of runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100
              })
              if (jobs.some(job => job.name === 'Quality gate' && job.conclusion === 'success')) {
                core.info('Required checks passed: ' + run.html_url)
                return
              }
            }
            core.setFailed('No successful CI quality gate exists for commit ' + revision)
      - uses: ./.github/actions/setup-rush
        with:
          cache-scope: manual-publish-npm
      - name: Prepare npm package versions
        run: |
          set -euo pipefail
          REF="$RELEASE_REF"
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm packages can only be published from a vMAJOR.MINOR.PATCH production tag."
            exit 1
          fi
          VERSION="${REF#refs/tags/v}"
          node common/scripts/bump.js "$VERSION"
          node common/scripts/bump.js --check "$VERSION"
        env:
          RELEASE_REF: ${{ inputs.ref }}
      - name: Building...
        run: node common/scripts/install-run-rush.js build
      - name: Emit TypeScript declarations
        run: node common/scripts/install-run-rush.js validate
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/common/config/rush/.npmrc-publish
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          node common/scripts/safe-publish.js
permissions:
  contents: read
  actions: read
