# Min override: excludes optional services from min deployment.
# Use with: docker compose -f docker-compose.yaml -f docker-compose.min.yaml up
# (rush docker:up:min)
# Excluded: preview, link-preview, elastic, redis, stats, payment, billing, fulltext_cockroach,
#           print, sign, hulykvs, hulygun, hulypulse, process-service, backup-pg, backup-cockroach,
#           backup-api, rating_cockroach
# Overrides below remove dependencies on excluded services so the min project validates.

services:
  preview:
    profiles: ["full"]
  link-preview:
    profiles: ["full"]
  elastic:
    profiles: ["full"]
  redis:
    profiles: ["full"]
  stats:
    profiles: ["full"]
  payment:
    profiles: ["full"]
  billing:
    profiles: ["full"]
  fulltext_pg:
    profiles: ["full"]
  print:
    profiles: ["full"]
  sign:
    profiles: ["full"]
  hulykvs:
    profiles: ["full"]
  hulygun:
    profiles: ["full"]
  hulypulse:
    profiles: ["full"]
  process-service:
    profiles: ["full"]
  backup-pg:
    profiles: ["full"]
  backup-cockroach:
    profiles: ["full"]
  backup-api:
    profiles: ["full"]
  rating_pg:
    profiles: ["full"]
  account:
    links: !override []
  workspace_pg:
    links: !override
      - postgres
      - minio
  collaborator:
    links: !override
      - minio
      - transactor_pg
  front:
    links: !override []
  transactor_pg:
    links: !override
      - postgres
      - minio
      - account
  export:
    links: !override
      - minio
  datalake:
    depends_on: !override
      minio:
        condition: service_healthy
      postgres:
        condition: service_started
      account:
        condition: service_started
