version: 2
kind: process
processes:
  review_card:
    label: Review card
    description: Create review tasks and mark the card reviewed when all tasks finish.
    autoStart: false
    showInHeader: true
    parallelExecutionForbidden: true
    slots:
      reviewers:
        label: Reviewers
        type: {array: {ref: contact.mixin.Employee}}
      status:
        label: Status
        type: string
    start:
      request_review:
        to: under_review
        on: OnExecutionStart
        actions:
          mark_under_review:
            method: UpdateCard
            params: {$slots.status: Under review}
          create_review_tasks:
            method: CreateToDo
            params:
              title: Review card
              user: $card.reviewers
              completionMode: all
              withRollback: true
            as: review_tasks
    states:
      under_review:
        label: Under review
        transitions:
          reviews_completed:
            to: reviewed
            on:
              OnToDoClose: {_id: $context.review_tasks}
            actions:
              mark_reviewed:
                method: UpdateCard
                params: {$slots.status: Reviewed}
      reviewed:
        label: Reviewed

catalog:
  methods:
    UpdateCard:
      requiredParams: []
      createdContext: null
    CreateToDo:
      requiredParams: [title, user]
      createdContext: {class: process.ProcessToDo, nameField: title}
  triggers:
    OnExecutionStart: {requiredParams: [], init: true}
    OnToDoClose: {requiredParams: [_id], auto: true}
