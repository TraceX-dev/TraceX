version: 1
kind: process
process:
  key: review-task
  label: Review card
  description: Create review tasks and mark the card reviewed when all tasks finish.
  autoStart: false
  slots:
    reviewers:
      kind: attribute
      label: Reviewers
      type: employee
      multiple: true
    status:
      kind: attribute
      label: Status
      type: string
  start:
    to: under-review
    actions:
      - update:
          status: Under review
      - task:
          key: review-tasks
          title: Review card
          users: reviewers
          completion: all
          rollback: true
  states:
    under-review:
      label: Under review
      transitions:
        - on:
            tasksCompleted: review-tasks
          to: reviewed
          actions:
            - update:
                status: Reviewed
    reviewed:
      label: Reviewed
