version: 2
kind: process
processes:
  approval_process:
    label: Approve card
    description: Request approval, mark approved cards, and unlock rejected cards.
    slots:
      approvers:
        label: Approvers
        type: {array: {ref: contact.mixin.Employee}}
      approved_tag:
        kind: class
        class: card.Tag
        label: Approved
    start:
      start_approval:
        to: waiting_for_approval
        on: OnExecutionStart
        actions:
          request_approval:
            method: RequestApproval
            params:
              user: $card.approvers
              field: $slots.approvers
            as: approval_request
          lock_card:
            method: LockCard
    states:
      waiting_for_approval:
        label: Waiting for approval
        transitions:
          approval_accepted:
            to: approved
            on:
              OnApproveRequestApproved: {_id: $context.approval_request}
            actions:
              add_approved_tag:
                method: AddTag
                params: {_id: $slots.approved_tag, props: {}}
          approval_rejected:
            to: rejected
            on:
              OnApproveRequestRejected: {_id: $context.approval_request}
            actions:
              unlock_card:
                method: UnlockCard
      approved:
        label: Approved
      rejected:
        label: Rejected

# Optional for UI authoring; this contract makes the example compilable offline.
catalog:
  methods:
    RequestApproval:
      requiredParams: [user]
      createdContext: {class: process.ApproveRequest}
  triggers:
    OnApproveRequestApproved: {requiredParams: [_id], auto: true}
    OnApproveRequestRejected: {requiredParams: [_id], auto: true}
