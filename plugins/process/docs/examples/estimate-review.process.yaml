version: 2
kind: process
processes:
  estimate_review:
    label: Review an estimate
    description: Collect effort and rate, calculate cost, and classify the estimate.
    slots:
      reviewers:
        type: {array: {ref: contact.mixin.Employee}}
      cost:
        type: number
      status:
        type: string
    start:
      request_estimate:
        to: waiting_for_estimate
        on: OnExecutionStart
        actions:
          request_review:
            method: CreateToDo
            params:
              title: Provide an estimate
              user: $card.reviewers
              completionMode: any
              withRollback: true
              askRequired: true
            as: review_tasks
            results:
              effort:
                label: Estimated effort
                type: number
              rate:
                label: Cost per unit
                type: number
    states:
      waiting_for_estimate:
        label: Wait for the first completed estimate
        transitions:
          estimate_received:
            to: classify_estimate
            on:
              OnToDoClose: {_id: $context.review_tasks}
            actions:
              calculate_cost:
                method: SetContext
                params:
                  value:
                    expr:
                      from: $context.effort
                      pipe:
                        - Multiply: {value: $context.rate}
                results:
                  total_cost:
                    label: Total cost
                    type: number
              save_cost:
                method: UpdateCard
                params:
                  $slots.cost: $context.total_cost
      classify_estimate:
        label: Classify the calculated estimate
        transitions:
          needs_approval:
            to: expensive
            on:
              OnCardUpdate:
                $slots.cost: {$gt: 100}
            actions:
              mark_for_approval:
                method: UpdateCard
                params: {$slots.status: Needs approval}
          within_budget:
            to: accepted
            on:
              OnCardUpdate:
                $slots.cost: {$lte: 100}
            actions:
              mark_accepted:
                method: UpdateCard
                params: {$slots.status: Accepted}
      expensive:
        label: Needs approval
      accepted:
        label: Accepted

# Offline contracts; the UI uses the installed model instead.
catalog:
  methods:
    CreateToDo:
      requiredParams: [title, user]
      createdContext: {class: process.ProcessToDo, nameField: title}
    SetContext:
      requiredParams: [value]
      createdContext: null
    UpdateCard:
      requiredParams: []
      createdContext: null
  triggers:
    OnExecutionStart: {requiredParams: [], init: true}
    OnToDoClose: {requiredParams: [_id], auto: true}
    OnCardUpdate: {requiredParams: [], auto: true}
  functions:
    Multiply: {type: transform, of: core:class:TypeNumber}
