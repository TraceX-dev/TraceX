version: 1
kind: card
card:
  key: risk
  label: Risk management
  description: Assess risk from probability and severity.
  fields:
    probability:
      label: Probability
      choice: [1, 2, 3, 4, 5]
      default: 1
      required: true
    severity:
      label: Severity
      choice: [1, 2, 3, 4, 5]
      default: 1
      required: true
    score:
      label: Risk score
      type: number
      calculate: number(probability) * number(severity)
    level:
      label: Risk level
      choice: [Insignificant, Moderate, Critical]
      calculate:
        cases:
          - when: score > 16
            value: Critical
          - when: score < 9
            value: Insignificant
        otherwise: Moderate
